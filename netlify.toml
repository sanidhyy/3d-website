[build]
  command = "pnpm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions.dalle]
  # Max on most Netlify plans; local netlify-cli honors this as well.
  timeout = 26

[[redirects]]
  from = "/api/v1/dalle"
  to = "/.netlify/functions/dalle"
  status = 200
  force = true

[dev]
  command = "pnpm run dev"
  targetPort = 5173
  port = 8888
